<oc-scene />
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

@if (nav.progress()) {
  <div class="progress" role="progressbar" aria-label="Uygulama merkezine geçiliyor"><span></span></div>
}

<header class="top">
  <a class="brand" ocNav="/" aria-label="OneCore ana sayfa">
    <span class="brandmark">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.45" />
        <ellipse cx="20" cy="20" rx="15" ry="5.5" fill="none" stroke="currentColor" stroke-width="1.2" transform="rotate(-25 20 20)" />
        <circle cx="20" cy="20" r="4.5" fill="currentColor" />
        <circle class="orbit" cx="33.5" cy="14" r="1.8" fill="#62e6b4" />
      </svg>
    </span>
    <span>
      <span class="brandname">ONECORE</span>
      <span class="branddesc">TÜM VERİ TEK MERKEZDE</span>
    </span>
  </a>
  <oc-main-nav />
  <div class="topright">
    <button class="search" type="button" (click)="nav.paletteOpen.set(true)" aria-label="Ara (Ctrl+K)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
      <span>Ara</span>
      <kbd>Ctrl K</kbd>
    </button>
    <span class="online" role="img" aria-label="Tüm sistemler çevrimiçi" title="Tüm sistemler çevrimiçi"></span>
    @if (back(); as b) {
      <a class="back" [ocNav]="b">← Geri</a>
    }
  </div>
</header>

<main class="stage" [class.leaving]="nav.leaving()">
  <router-outlet />
</main>

<oc-palette />

<footer class="bottom" [hidden]="workspace()">
  <span>ONECORE <b>—</b> TÜM VERİ TEK MERKEZDE</span>
  <span class="scrollhint"><i></i> CTRL K ARA · ESC GERİ · 1–4 HIZLI GEÇİŞ</span>
</footer>
